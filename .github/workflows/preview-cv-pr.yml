name: Preview CV PDFs on PR

on:
  pull_request:
    paths:
      - '**.tex'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to build a preview for'
        required: true

concurrency:
  group: preview-cv-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR ref
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number
              ?? Number(context.payload.inputs?.pr_number);
            if (!prNumber) { core.setFailed('No PR number resolved.'); return; }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput('number', String(prNumber));
            core.setOutput('sha', pr.head.sha);
            core.setOutput('ref', pr.head.ref);

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-extra \
            texlive-fonts-extra \
            texlive-latex-recommended \
            texlive-science

      - name: Build CV PDFs
        run: |
          pdflatex -interaction=nonstopmode cv.tex
          pdflatex -interaction=nonstopmode cv.tex
          pdflatex -interaction=nonstopmode cv1.tex
          pdflatex -interaction=nonstopmode cv1.tex

      - name: Upload PDF artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: cv-preview-pr-${{ steps.pr.outputs.number }}
          path: |
            cv.pdf
            cv1.pdf
          retention-days: 14
          if-no-files-found: error

      - name: Post sticky preview comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number('${{ steps.pr.outputs.number }}');
            const sha = '${{ steps.pr.outputs.sha }}';
            const artifactUrl = '${{ steps.upload.outputs.artifact-url }}';
            const marker = '<!-- cv-preview-comment -->';
            const body = [
              marker,
              '### CV PDF preview',
              '',
              `Built from \`${sha.slice(0,7)}\`.`,
              '',
              `Download the rendered PDFs: **[cv-preview-pr-${prNumber}](${artifactUrl})**`,
              '',
              '- `cv.pdf` — full CV',
              '- `cv1.pdf` — ATS / compact variant',
              '',
              '_Artifact kept for 14 days. Re-runs automatically on each new commit._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
